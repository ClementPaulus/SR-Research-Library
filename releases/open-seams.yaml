  - id: SEAM-0020
    area: registry.sources.public-only-queue
    description: >-
      "Shape, Phase, and Forcing in Saturn's Southern Decagon: An Integrated Inference and External-Testing
      Protocol" is exposed on the author's Academia profile as Active Tier-2 / Domain Closures (candidate class
      external-ingress) but no local source file or DOI is available (census status SOURCE_NEEDED). Public
      placement alone does not create admission; no SourceID or ObjectID is allocated until the source is acquired.
      2026-09 census pass: the source is now publicly deposited (Zenodo 10.5281/zenodo.22550978, concept 22550977,
      Final author edition v2.0.1, 6 September 2026, deposited PDF read) and is registered as SRC-000059 (source
      only). No ObjectID is allocated: the corpus owner has not supplied the library classification for this work,
      and the census instruction placed it outside the classified scope. Remaining burden: owner-supplied Tier-2
      classification, then ordinary admission.
    status: open
  - id: SEAM-0021
    area: registry.census
    description: >-
      Corpus census working package SR_CORPUS_CENSUS_WORKING_PACKAGE_v0_2 (placement pass over local file states,
      chronology, Zenodo community, and Academia profile) reports 70 candidate source states, 11 candidate
      governing references, and 35 candidate Tier-2 objects, with permanent identifiers deliberately deferred
      until deduplication and archive lineage are stable. The package is working evidence (it includes a local
      filesystem scan) and is kept out of the repository (.gitignore); only its resolved seams are carried here
      (SEAM-0018..0020). Candidates not yet in the registry include DMT Version 2.0 (SRC-000019 currently resolves
      to the latest Zenodo version), Nested Return in a Composite Diamond Clock, Recursive Accelerating Return
      (10.5281/zenodo.22035775, not resolvable on 2026-09-13), Identifiable Return in Memristive Associative Memory
      (external DOI 10.1038/s41467-026-69958-0 belongs to He et al., not to the local paper), and The First
      Seam-Chain Casepack (DOI unresolved). Allocation awaits the deduplicated intellectual-object ledger.
      2026-09 census pass status (see docs/TIER2_CENSUS_2026-09.md): REGISTERED — The First Seam-Chain Casepack
      (SRC-000047 / SR-OBJ-000020, DOI 10.5281/zenodo.19870445 verified), Nested Return in a Composite Diamond Clock
      (SRC-000049 / SR-OBJ-000021; external anchor SRC-000048), Recursive Accelerating Return (SRC-000050 /
      SR-OBJ-000022; 10.5281/zenodo.22035775 now resolves, latest version 22121149), Identifiable Return in
      Memristive Associative Memory (SRC-000052 / SR-OBJ-000023, owner-supplied manuscript, no DOI at the pass; external
      anchor SRC-000051; publication update 2026-09-13: Version 1.2 deposited as 10.5281/zenodo.22695434, concept
      22695433, verified; object resubmitted as 1.0.1 archived, RCPT-000036), Language Across Articulation (SRC-000053 / SR-OBJ-000024), Empirical Regime Auditing v2.0
      (existing SRC-000046 / SR-OBJ-000025), Confinement as Integrity Collapse (SRC-000054 / SR-OBJ-000026,
      historical), Contract-First Epistemology full course, Semester I, Semester II, Syllabus and Audit Receipt
      (SRC-000055..058 / SR-OBJ-000027..030, shared archive 10.5281/zenodo.20074210). REPAIRED — SR-OBJ-000017,
      SR-OBJ-000019 (SEAM-0013 closed). STILL BLOCKED — SR-OBJ-000016 (SEAM-0011). SOURCE REGISTERED, OBJECT
      PENDING OWNER CLASSIFICATION — Saturn Southern Decagon (SRC-000059, SEAM-0020). VERSION LINEAGE ONLY — DMT
      Version 2.0 (SRC-000019 typed with the v1.0 record 21726225 as earlier_version; SR-OBJ-000011 unchanged).
      Remaining census candidates without acquired sources stay unallocated.
    status: open
  - id: SEAM-0022
    area: registry.sources.archive-record-relationship
    description: >-
      Liber Collapsus, Zenodo records 22310064 <-> 22310544 (UNRESOLVED_SEAM, non-blocking). Record 22310064
      (the canonical DOI) currently carries the title "Liber Universalis de Collapsu Mathematicae" under concept
      10.5281/zenodo.16809846 with file liber_collapsus.pdf; record 10.5281/zenodo.22310544 (concept 22310543)
      carries the Liber Collapsus title with identical files and declares isNewVersionOf 22310064. Whether
      22310544 is a retitled re-deposit, a distinct edition, or a metadata error on either record is not
      established by any source. SRC-000018 stays active with 22310064 as its canonical DOI and 22310544 typed
      alternate_record; SR-GOV-000009 carries the seam in its released missingness. Resolution requires the
      corpus owner to correct or confirm the Zenodo record metadata.
    status: open
