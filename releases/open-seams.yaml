  - id: SEAM-0019
    area: registry.sources.doi-lineage
    description: >-
      Provenance & Canon Note (SRC-000023): the source PDF states bundle DOI 10.5281/zenodo.17925173 while external
      metadata gives 10.5281/zenodo.17925172 (census LIN-0004). Zenodo metadata (2026-09-13): 17925173 is version
