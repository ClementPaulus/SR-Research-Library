  - id: SEAM-0015
    area: registry.governing.publication-protocol
    description: >-
      Two publishing-protocol documents were supplied: SR-PUBLISHING-PROTOCOL.v1.0 (finalized 2026-08-28; self-declared
      "final Tier-0 publishing protocol; adopted working standard"; listed by the handoff manifest as "publishing
      guidance") and SR-PUBLISHING-PROTOCOL.v1.0-rc1 (prepared 2026-08-29; self-declared "internal Tier-0 repair
      candidate; not canon-frozen"; names a 2026-08-28 repaired working draft as predecessor). Version order and
      adoption status disagree. Registered as SR-GOV-000014 (unresolved) and SR-GOV-000015 (candidate) with
      supersedes null; not reconciled. Requires a corpus-owner adoption record.
    status: closed
    closed_by: >-
      cleanup/v1.1-foundation (PR #3) — corpus-owner decision (2026-09-13) following the sources' own status lines: SR-GOV-000014
      (SR-PUBLISHING-PROTOCOL.v1.0, "final Tier-0 publishing protocol; adopted working standard") is active;
      SR-GOV-000015 (rc1, "internal Tier-0 repair candidate; not canon-frozen") remains candidate with no
      supersession implied. Only status changed on the released records; their historical missingness text is
      preserved unedited.
  - id: SEAM-0016
    area: registry.governing.ingress
    description: >-
      The June 2026 Ingress Paper (SR-GOV-000016, DOI 10.5281/zenodo.20549483, under the Orientation Series concept
      DOI 10.5281/zenodo.19622272) states that it replaces the former three-part orientation burden. Neither it nor
      the April 2026 route companion (SR-GOV-000017) states whether the companion remains the active route
      reference, and no source states that the Orientation Series objects (SR-OBJ-000001..003) become historical.
      SR-GOV-000017 is registered as unresolved; no object maturity was changed.
    status: open
  - id: SEAM-0017
    area: registry.governing.handoff-evidence
    description: >-
      The governing records SR-GOV-000001..018 and sources SRC-000035..046 were populated from the full-text
      handoff bundle SR_LIBRARY_GOVERNING_CORE_HANDOFF_v1_0 (SHA256SUMS recorded on each new source as
      identifier.archive_reference). The bundle, including its PDFs and Markdown specifications, is handoff
      evidence and is not committed to this repository (ignored via .gitignore). Committing any full text requires
      an explicit repository policy and licensing decision. Works without a DOI in the bundle (SRC-000035..038,
      SRC-000039..042, SRC-000044, SRC-000045) therefore have no public archive anchor yet.
    status: open
