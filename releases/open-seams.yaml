      10.5281/zenodo.16745537 - expected: Collapse-Compatible Conjecture Catalog v1.0; observed:
      "Collapse-Compatible Conjecture Catalog" (2025-08-03).
      10.5281/zenodo.16696719 - expected: Collapse is Generative: Axiomatic Foundation and CEFL v1.1; observed:
