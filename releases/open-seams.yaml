      10.5281/zenodo.16623285 - expected: empirical calibration of UMCP using Hawking-analog / polariton-fluid data;
      observed: "Universal Mathematics & Collapse Platform (UMCP): Empirical Calibration via Hawking-Analog
      Polariton Fluids" (Dataset, 2025-07-30).
      10.5281/zenodo.16757373 - expected: anyons / TQFT / topological-quantum collapse audit; observed: "Universal
      Mathematics & Collapse Platform (UMCP) Audit of Self-Sustained Frictional Cooling in Active Matter" (Dataset,
      2025-08-06) - expected family NOT matched.
      10.5281/zenodo.16749329 - expected: Field Stability, Regime Closure, and Universal Audit; observed (concept ->
