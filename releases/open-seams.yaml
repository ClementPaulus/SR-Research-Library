    status: closed
    closed_by: >-
      cleanup/v1.1-foundation (PR #3) — lineage is now typed on the records: SRC-000012/013 carry concept_doi, version_doi (the
      listed public DOI), and the earlier version records as related_dois earlier_version. Concept and version DOIs
