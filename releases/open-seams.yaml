      10.5281/zenodo.16908155 - expected: UMCP v1.0.1 canonical kernel / weld guarantees / audit protocol; observed:
      "UMCP v1.0.1: Canonical Kernel, Weld Guarantees, and Audit Protocol" (2025-08-19).
      10.5281/zenodo.16734906 - expected: Universal Regime Diagnostic Toolkit v1.0; observed: "Universal Regime
      Diagnostic Toolkit: Modular Software and API for Field-Ready Collapse Diagnostics, Memory Audit, and Agent
