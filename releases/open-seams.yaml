# Structura Reditus Research Library — Open seams.
# Unresolved decisions that the library contract has not yet closed. Seams are
# copied into each release manifest; closed seams are kept here with status
# `closed` and the version that closed them, never deleted.
seams:
  - id: SEAM-0001
    area: registry
    description: Registry contains no research objects, sources, or relations yet; no actual source metadata was supplied, and records are never fabricated or bulk-populated.
    status: closed
    closed_by: first DOI-bearing corpus import (34 sources, 19 objects submitted, 3 relations), 2026-09-13.
  - id: SEAM-0002
    area: site
    description: The public surface is a minimal static generated page; per-entity and per-axis route families (see site/README.md) remain to be built.
    status: closed
    closed_by: cleanup/v1.1-foundation (PR #3) — the site generates governing, object, source, author, receipt, relation, timeline, question, and per-axis pages (see site/README.md).
  - id: SEAM-0003
    area: receipts
    description: Receipt IDs are allocated sequentially from the receipts/ tree; a concurrent-submission allocation policy is not yet declared.
    status: open
  - id: SEAM-0004
    area: taxonomy
    description: Taxonomy deprecation is documented (deprecate-in-place) but no machine-readable `deprecated` flag exists yet in taxonomy files.
    status: open
  - id: SEAM-0005
    area: profiles
    description: Author-profile output is exposed via site/data/profiles.json only; no dedicated per-author pages exist yet.
    status: closed
    closed_by: cleanup/v1.1-foundation (PR #3) — /authors/<AuthorID> pages are generated from the registry profiles.
  - id: SEAM-0006
    area: taxonomy.domains
    description: Whether the domain list should be expanded further before first external submission intake.
    status: open
  - id: SEAM-0007
    area: site.questions-routing
    description: Final question slug normalization and canonicalization policy.
    status: closed
    closed_by: >-
      cleanup/v1.1-foundation (PR #3) — /questions/<slug> is generated. Policy: slug = main_question lower-cased, Unicode
      normalized to ASCII, every run of non-alphanumerics replaced by '-', trimmed, truncated to 80 characters at a
      word boundary; objects whose main questions normalize to the same slug share one page. The slug is a
      navigation key only; the canonical question text lives on each object record.
  - id: SEAM-0008
    area: registry.sources.shared-doi
    description: >-
      Shared archive DOIs identify archives containing several distinct member works:
      10.5281/zenodo.21212668 (SRC-000002..005, coordinated four-paper release), 10.5281/zenodo.19637774
      (SRC-000006..008, Orientation Series I-III), 10.5281/zenodo.17189775 (SRC-000031 The Episteme Construction,
      SRC-000032 The Common Doorway), 10.5281/zenodo.17980036 (SRC-000023 Provenance & Canon Note, SRC-000024
      A Geometry of Admissible Seams). The SourceID identifies the named work; the DOI identifies the archive.
      Member works are neither collapsed into one object nor counted as separate DOI deposits. Whether member
      works should later receive their own DOIs is a corpus-owner decision.
    status: closed
    closed_by: >-
      cleanup/v1.1-foundation (PR #3) — handled by the shared-archive policy (README, LIBRARY_SPECIFICATION §3.2, registry/README):
      one DOI may anchor several named works, each keeps its own SourceID, and shared membership is not multiple
      deposits. Typed as relation shared_archive in related_dois. Minting separate DOIs is a publication decision,
      not a library-architecture seam.
  - id: SEAM-0009
    area: registry.sources.doi-lineage
    description: >-
      SRC-000015 (GCD/UMCP whitepaper): the active corpus identifies 10.5281/zenodo.18819238 as the preferred paper
      DOI; ResearchGate metadata also exposes 10.5281/zenodo.18819239. Observed Zenodo metadata (2026-09-13):
      18819238 is registered as the concept DOI whose latest version is record 18893328 (v2.1.5, 2026-03-05);
      18819239 is a version DOI (v2.1.3, 2026-02-28) under that concept. Recorded as evidence only; the exact
      concept/version relationship the corpus intends remains unresolved and is not silently reconciled. One
      source record and no duplicate object.
    status: closed
    closed_by: >-
      cleanup/v1.1-foundation (PR #3) — resolved: 10.5281/zenodo.18819238 is the concept DOI and the library's canonical anchor
      (SRC-000015 concept_doi); 18819239 is kept only as historical version metadata (related_dois,
      earlier_version). The released governing record SR-GOV-000010 was not edited; SR-GOV-000019 supersedes it
      with the resolved lineage.
  - id: SEAM-0010
    area: registry.sources.canonical-doi
    description: >-
      SRC-000018 / SR-GOV-000009 (Liber Collapsus): which DOI the library uses as the canonical anchor for Liber
      Collapsus. Canonical corpus DOI: 10.5281/zenodo.22310064, as designated by the corpus owner for the Structura
      Reditus Zenodo community; 22310544 is not substituted. The external Zenodo record relationship is a separate
      burden and is tracked as SEAM-0022.
    status: closed
    closed_by: >-
      cleanup/v1.1-foundation (PR #3) — canonical DOI decision closed: 10.5281/zenodo.22310064 (SRC-000018
      identifier.doi; SR-GOV-000009 doi). This closure covers the DOI decision only.
  - id: SEAM-0011
    area: registry.sources.doi-mismatch
    description: >-
      SRC-000033 (The Collapse Formalism: A Reader's Guide to the UMCP/RCFT/ULRC Stack): listed DOI
      10.5281/zenodo.16990995 resolves (concept) to Collapse Calculus (SRC-000034; versions 16990996, 17007222),
      whose file listings contain no Collapse Formalism work. Source identity unverified; SR-OBJ-000016 was
      RETURNED_FOR_REPAIR (RCPT-000016). Repair requires a DOI or archive reference that resolves to the titled work.
      Re-searched in the 2026-09 census pass (Zenodo API, creator "Paulus, Clement", titles Formalism / Reader's Guide,
      all versions; Collapse Calculus concept 16990995 version records 16990996 and 17007222 file listings): no record
      or file titled The Collapse Formalism exists. SR-OBJ-000016 remains RETURNED_FOR_REPAIR under its reserved
      identity; no new receipt was generated for an unchanged blocked submission. Still missing: an archive record,
      DOI, or owner-supplied manuscript that resolves to the titled work, from which the next burden can be read.
    status: open
  - id: SEAM-0012
    area: registry.sources.title-variance
    description: >-
      Zenodo record titles differ from the listed titles for SRC-000016 (record: "Universal Measurement Contract
      Protocol"; listed: "UMCP CasePack Publication"), SRC-000030 (record: "Generative Collapse Dynamics 4 Tier
      Stack"; listed: "Generative Collapse Dynamics: Kernel, Platform, Theory, and Governance"; four member PDFs),
      and SRC-000021 (bundle record title). Listed titles retained; observed titles recorded in each source's
      missingness. Whether records should be retitled on Zenodo is a corpus-owner decision.
    status: open
  - id: SEAM-0013
    area: registry.objects.next-burden
    description: >-
      SR-OBJ-000017 (Collapse Calculus) and SR-OBJ-000019 (A Geometry of Admissible Seams) are candidate-class
      historical objects whose public records state no next burden; because candidate material implies a stronger
      later use, both were RETURNED_FOR_REPAIR (RCPT-000017, RCPT-000019) pending the paper's own stated burden.
      Submissions archived beside their receipts.
    status: closed
    closed_by: >-
      2026-09 Tier-2 census and repair pass — the next burdens were read from the deposited PDFs themselves (Collapse
      Calculus at 10.5281/zenodo.16990996: weld pre/post test with tolerance on |Δκ|, manifest hashes, hashed audit
      rows, κ continuity under composition; A Geometry of Admissible Seams in 10.5281/zenodo.17980036: Appendix D
      portability criteria). Both resubmitted under the SAME reserved identities as version 1.0.1 and ACCEPTED
      (RCPT-000023, RCPT-000024); the RETURNED_FOR_REPAIR receipts and archived submissions are preserved. The
      historical-vs-current UNRESOLVED_SEAM on each object is kept: nothing historical is promoted.
