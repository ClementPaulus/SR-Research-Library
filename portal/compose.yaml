# Local development stack for the researcher portal.
#   docker compose -f portal/compose.yaml up --build
# Web: http://localhost:8000  ·  Captured email (Mailpit): http://localhost:8025  ·  MinIO console: http://localhost:9001
# Nothing here is a production secret; every value is a documented local placeholder (see portal/.env.example).
# Migrations run in the one-shot `migrate` service so web and worker never race to migrate.

name: sr-research-portal

x-portal-env: &portal-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: local-development-only-secret-not-for-production
  PORTAL_PUBLIC_BASE_URL: http://localhost:8000
  PORTAL_ALLOWED_HOSTS: localhost,127.0.0.1,web
  DATABASE_URL: postgres://portal:portal-local@postgres:5432/portal
  CELERY_BROKER_URL: redis://redis:6379/0
  EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  DEFAULT_FROM_EMAIL: library@localhost
  PORTAL_STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: portal-private
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: minio-local
  S3_SECRET_ACCESS_KEY: minio-local-secret
  PORTAL_REGISTRY_REPO_PATH: /srv/library
  PORTAL_REGISTRY_DEFAULT_BRANCH: main
  PORTAL_GITHUB_ADAPTER: registry_bridge.fake_github.FakeGitHubClient   # local: git-backed double; staging/prod: registry_bridge.github_app.GitHubAppClient
  GITHUB_REPO_OWNER: local
  GITHUB_REPO_NAME: local
  GITHUB_WEBHOOK_SECRET: local-webhook-secret
  PORTAL_SUPPORT_CONTACT: library@localhost

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal-local
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U portal"], interval: 5s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio-local, MINIO_ROOT_PASSWORD: minio-local-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 3s, retries: 20 }

  minio-init:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 minio-local minio-local-secret && mc mb --ignore-existing local/portal-private && mc version enable local/portal-private"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

  migrate:
    build: { context: .., dockerfile: portal/Dockerfile }
    environment: *portal-env
    command: ["python", "portal/manage.py", "migrate", "--noinput"]
    depends_on: { postgres: { condition: service_healthy } }

  web:
    build: { context: .., dockerfile: portal/Dockerfile }
    environment: *portal-env
    command: ["python", "portal/manage.py", "runserver", "0.0.0.0:8000"]
    ports: ["8000:8000"]
    volumes: ["..:/srv/library"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: { context: .., dockerfile: portal/Dockerfile }
    environment: *portal-env
    working_dir: /srv/library/portal
    command: ["celery", "-A", "config", "worker", "--beat", "--loglevel=INFO", "--concurrency=2"]
    volumes: ["..:/srv/library"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

volumes:
  pgdata: {}
  miniodata: {}
