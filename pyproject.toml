[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structura-reditus-research-library"
version = "1.0.0"
description = "Registry, admission, receipt, and retrieval tooling for the Structura Reditus Research Library"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["validators"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
