name: Validate Research Library

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m validators.validate
      - run: python -m pytest
      - name: Site is regenerated from the registry
        run: |
          python -m validators.build_site
          git diff --exit-code -- site
